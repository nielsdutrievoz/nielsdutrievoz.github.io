<!DOCTYPE html>
{% assign lang = page.lang | default: "en" %}
<html lang="{% if lang == 'fr' %}fr-FR{% else %}en-US{% endif %}">
<head>
{% include head.html %}
</head>
<body class="{{ page.layout }}">
  <a class="skip" href="#content">{{ site.data.i18n[lang].skip }}</a>
  {% include topbar.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
